# MongoDB para el historico de partidas de Nimble Pong.
#
# Levanta la base y, al lado, mongo-express para mirarla desde el navegador.
# El juego guarda cada ronda terminada en UNA sola coleccion: `matches`.
#
#   docker compose up -d          # mongo :27017, express :8081
#   docker compose down           # apaga y conserva los datos
#   docker compose down -v        # apaga y borra el historico
#
# Los puertos son variables para no chocar con otros stacks (XFREE ya usa
# 27017/8081): `MONGO_PORT=27018 MONGO_EXPRESS_PORT=8082 docker compose up -d`.
services:
  mongodb:
    image: mongo:7
    container_name: nimble-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-jev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-jevpass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-nimble}
    volumes:
      - nimble_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER:-jev}", "-p", "${MONGO_PASS:-jevpass}", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Interfaz web (el equivalente a MongoDB Compass, pero en el navegador).
  # http://localhost:8081 con admin / admin123.
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: nimble-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-jev}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-jevpass}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-jev}:${MONGO_PASS:-jevpass}@mongodb:27017/${MONGO_DB:-nimble}?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_SITE_BASEURL: /

volumes:
  nimble_mongo_data:
